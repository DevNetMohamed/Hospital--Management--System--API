name: Build and Push Docker Images

on:
    # push:
    # branches:
    #     - master
    workflow_dispatch: {}

env:
    REGISTRY: docker.io
    IMAGE_OWNER: mohamedadel204

jobs:
    docker:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Build & Push Base Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/base.Dockerfile
                  push: true
                  tags: |
                      mohamedadel204/hospital-base:latest
                      mohamedadel204/hospital-base:${{ github.sha }}

            - name: Build & Push API Gateway
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/api-gateway.Dockerfile
                  push: true
                  tags: |
                      mohamedadel204/api-gateway:latest
                      mohamedadel204/api-gateway:${{ github.sha }}

            - name: Build & Push Auth Service
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/auth-service.Dockerfile
                  push: true
                  tags: |
                      mohamedadel204/auth-service:latest
                      mohamedadel204/auth-service:${{ github.sha }}
