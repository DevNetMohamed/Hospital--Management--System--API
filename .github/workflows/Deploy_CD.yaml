name: Deploy CD

on:
    workflow_dispatch:
        inputs:
            image_tag:
                description: >
                    Image tag to deploy. Use "latest" for a chart-only redeploy
                    (no new app code), or a specific commit SHA if you need an
                    exact build that was pushed by the CI workflow.
                required: false
                default: "latest"
    workflow_run:
        workflows: ["Build and Push Docker Images"]
        types:
            - completed
        branches: [master]

jobs:
    deploy:
        # Only gate on conclusion when triggered by workflow_run.
        # A manual workflow_dispatch run has no workflow_run event, so this
        # condition must pass through in that case instead of evaluating to false.
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        runs-on: self-hosted

        steps:
            - name: Resolve image tag and commit to check out
              id: resolve
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
                    echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
                    echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ steps.resolve.outputs.ref }}

            - name: Point kubectl at the local kind cluster
              run: kubectl config use-context docker-desktop

            - name: Patch image tags in values.yaml
              # Editing values.yaml directly (rather than using --set on the
              # services array) avoids Helm's array-merge behavior, which
              # replaces the whole array element instead of merging fields —
              # that was silently wiping out "service", "name", etc. and
              # causing "nil pointer evaluating .service.type".
              # This edit is local to the runner's checkout only; it is never
              # committed or pushed back to the repo.
              run: |
                  yq eval '(.services[] | select(.name == "api-gateway") | .image.tag) = "${{ steps.resolve.outputs.tag }}"' -i ./helm/hospital-management-system/values.yaml
                  yq eval '(.services[] | select(.name == "auth-service") | .image.tag) = "${{ steps.resolve.outputs.tag }}"' -i ./helm/hospital-management-system/values.yaml

            - name: Deploy with Helm
              run: |
                  helm upgrade --install hospital-management-system \
                    ./helm/hospital-management-system \
                    --namespace hospital-management-system \
                    --create-namespace \
                    --wait --timeout 5m

            - name: Verify rollout
              run: |
                  kubectl rollout status deployment/api-gateway -n hospital-management-system
                  kubectl rollout status deployment/auth-service -n hospital-management-system
